[project]
name = "gobs-learn"
version = "0.1.0"
description = "L0→L1 coaching for a gobs Obsidian vault."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "wisdom-km" }]
keywords = ["obsidian", "gobs", "learn", "grok"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = [
  "gobs @ git+https://github.com/wisdom-km/gobs.git@core",
]

[project.urls]
Homepage = "https://github.com/wisdom-km/gobs-learn"
Issues = "https://github.com/wisdom-km/gobs-learn/issues"

[project.scripts]
gobs-learn = "gobs_learn.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gobs_learn = ["templates/*.md", "templates/skills/*/SKILL.md"]
